name: Command Code catalog sync

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/check-commandcode-model-metadata.ts"
      - ".github/workflows/model-metadata.yml"
      - "src/commandcode-catalog.ts"
      - "src/core.ts"
      - "src/models.ts"
      - "tests/test-model-metadata-check.ts"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: commandcode-catalog-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'sync' }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Compare with the latest Command Code CLI
        run: npm run check:commandcode-catalog | tee commandcode-catalog-report.md
      - name: Publish catalog report
        if: always()
        run: cat commandcode-catalog-report.md >> "$GITHUB_STEP_SUMMARY"

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Refresh the live model list snapshot
        run: npm run refresh:model-ids
      - name: Synchronize with the latest Command Code CLI
        run: npm run sync:commandcode-catalog | tee commandcode-catalog-report.md
      - name: Prune overrides now shipped by the catalog
        run: npm run prune:catalog-overrides
      - name: Refresh the pricing fixture
        run: npm run sync:pricing-fixture
      - name: Format and verify synchronized files
        run: |
          npm run format -- src/commandcode-catalog.ts src/commandcode-catalog-overrides.ts src/commandcode-pricing-catalog.ts README.md
          npm run typecheck
          npm run test:models
          npm run format:check
          git diff --check
      - name: Publish catalog report
        if: always()
        run: cat commandcode-catalog-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit, version bump, and tag
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/commandcode-catalog.ts \
            src/commandcode-catalog-overrides.ts \
            src/commandcode-pricing-catalog.ts \
            tests/fixtures/commandcode-model-ids.json \
            tests/fixtures/commandcode-pricing.json \
            README.md
          if git diff --cached --quiet; then
            echo "Catalog is already current; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore(models): sync Command Code catalog"
          npm version patch -m "chore(release): v%s"
          git push --follow-tags
      - name: Publish to npm
        if: steps.release.outputs.changed == 'true' && vars.NPM_PUBLISH == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
